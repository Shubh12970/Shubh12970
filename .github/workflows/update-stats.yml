name: Update profile stats

on:
  schedule:
    - cron: "23 2,14 * * *"   # twice daily (07:53 and 19:53 IST); off the top of the hour
  workflow_dispatch:
  push:
    paths:
      - "scripts/generate_stats.py"
      - ".github/workflows/update-stats.yml"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build stat cards from the GitHub API
        env:
          GH_TOKEN: ${{ secrets.PROFILE_STATS_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::PROFILE_STATS_TOKEN secret is not set - profile cards were NOT refreshed."
            exit 1
          fi
          python3 scripts/generate_stats.py
      - name: Commit changes (as the Actions bot, so it adds no contributions)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/*.svg
          git diff --cached --quiet || git commit -m "Update profile stats"
          git push
